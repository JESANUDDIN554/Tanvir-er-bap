# Builds the FULL Itraji Cliper installer as ONE ISO disc image:
# the normal app payload PLUS the ~9 GB built-in AI model
# (Qwen2.5-14B-Instruct Q4_K_M GGUF) and the llama.cpp engine baked in,
# so the app is fully ready right after install - no first-run download.
#
# The output (~9.2 GB) exceeds the 2 GB GitHub Release asset limit, so
# it is published as a workflow ARTIFACT (name: ItrajiCliper-Setup-Full),
# not a Release asset. The light installer flow (build-exe.yml) is
# untouched.
#
# How the single file works: the Inno compile step builds the
# disk-spanned parts (ItrajiCliper-Setup-Full.exe + .bin parts, each
# < 2 GB - the exact payload that silent-installs and passes the full
# verification battery in CI), and the ISO step below wraps those
# parts + a README.txt into ONE ItrajiCliper-Full.iso (ISO9660 +
# Joliet, built with the native Windows IMAPI2FS API). In Windows
# 10/11 the user just double-clicks the .iso - Windows mounts it as
# a virtual DVD drive - then runs the setup exe inside.
#
# A single self-extracting .exe was tried and abandoned: Windows
# refuses to launch a PE file of ~9.6 GB ("not a valid application
# for this OS platform") - the same Windows limit that makes Inno
# Setup require disk spanning above ~4.2 GB. An ISO image has no
# such limit, and every file inside it is < 2 GB.
#
# The model is NOT in git: this workflow downloads it from the official
# bartowski Hugging Face repo and hard-fails unless its size and
# SHA256 match the pinned values from local_ai.py / HF LFS metadata.
name: Build Windows EXE (Full, AI model included)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'installer-full.iss'

permissions:
  contents: write   # file an issue with the log tail if the build fails
  issues: write

jobs:
  build-full:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download YuNet face model (binary, not stored in git)
        shell: bash
        run: |
          curl -L -o models/face_yunet.onnx https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx
          ls -la models/

      - name: Build with PyInstaller
        id: build
        shell: bash
        run: |
          set -o pipefail
          sed -i 's/upx=True/upx=False/' ClipMakerPC.spec
          pyinstaller ClipMakerPC.spec 2>&1 | tee build.log

      - name: Bundle ffmpeg + ffprobe (standalone, no install needed)
        if: success()
        shell: bash
        run: |
          curl -L -o ffmpeg.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
          7z x ffmpeg.zip -offmpeg_dl > /dev/null
          EXE_DIR=$(echo ffmpeg_dl/ffmpeg-*-essentials_build/bin)
          cp "$EXE_DIR/ffmpeg.exe" "$EXE_DIR/ffprobe.exe" dist/ClipMakerPC/
          ls -la dist/ClipMakerPC/ffmpeg.exe dist/ClipMakerPC/ffprobe.exe dist/ClipMakerPC/ClipMakerPC.exe

      - name: Pick the staging drive with the most free space
        if: success()
        shell: pwsh
        run: |
          $best = Get-PSDrive -PSProvider FileSystem |
            Sort-Object Free -Descending | Select-Object -First 1
          $stage = Join-Path $best.Root 'itraji-full-stage'
          New-Item -ItemType Directory -Force -Path `
            "$stage\models", "$stage\llama", "$stage\out" | Out-Null
          "STAGE_DIR=$stage" | Out-File -FilePath $env:GITHUB_ENV -Append
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} |
            Format-Table | Out-String | Write-Host
          Write-Host "Staging dir: $stage"

      - name: Download built-in AI model + verify size and SHA256
        if: success()
        shell: pwsh
        run: |
          $url = 'https://huggingface.co/bartowski/Qwen2.5-14B-Instruct-GGUF/resolve/main/Qwen2.5-14B-Instruct-Q4_K_M.gguf'
          $dest = Join-Path $env:STAGE_DIR 'models\Qwen2.5-14B-Instruct-Q4_K_M.gguf'
          curl.exe -L --fail --retry 3 -o $dest $url
          if ($LASTEXITCODE -ne 0) { throw "model download failed: curl exit $LASTEXITCODE" }
          $f = Get-Item $dest
          if ($f.Length -ne 8988110976) {
            throw "model size mismatch: got $($f.Length), want 8988110976"
          }
          $h = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLower()
          if ($h -ne 'e47ad95dad6ff848b431053b375adb5d39321290ea2c638682577dafca87c008') {
            throw "model SHA256 mismatch: got $h"
          }
          Write-Host "Model verified: $($f.Length) bytes, sha256=$h"

      - name: Download llama.cpp engine (pinned like local_ai.py) + extract
        if: success()
        shell: pwsh
        run: |
          $zip = Join-Path $env:STAGE_DIR 'llama-engine.zip'
          curl.exe -L --fail --retry 3 -o $zip 'https://github.com/ggml-org/llama.cpp/releases/download/b11803/llama-b11803-bin-win-cpu-x64.zip'
          if ($LASTEXITCODE -ne 0) { throw "engine download failed: curl exit $LASTEXITCODE" }
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:STAGE_DIR 'llama') -Force
          Remove-Item $zip
          $srv = Get-ChildItem -Recurse (Join-Path $env:STAGE_DIR 'llama') `
            -Filter 'llama-server.exe' | Select-Object -First 1
          if (-not $srv) { throw 'llama-server.exe not found in engine zip' }
          Write-Host "Engine verified: $($srv.FullName)"

      - name: Build the FULL one-file installer (Inno Setup)
        if: success()
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command ISCC.exe).Source }
          $out = Join-Path $env:STAGE_DIR 'out'
          & $iscc "/DFullPayloadDir=$env:STAGE_DIR" "/DFullOutDir=$out" installer-full.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit $LASTEXITCODE" }
          $parts = Get-ChildItem $out -File | Sort-Object Name
          $parts | Select-Object Name, Length |
            Format-Table | Out-String | Write-Host
          if (-not ($parts | Where-Object { $_.Name -eq 'ItrajiCliper-Setup-Full.exe' })) {
            throw 'ItrajiCliper-Setup-Full.exe missing from out dir'
          }
          $bins = $parts | Where-Object { $_.Extension -eq '.bin' }
          if (-not $bins) { throw 'disk spanning produced no .bin parts' }
          foreach ($p in $parts) {
            if ($p.Length -ge 2000000000) {
              throw "part $($p.Name) is $($p.Length) bytes, >= the 2 GB release-asset limit"
            }
          }
          $total = ($parts | Measure-Object Length -Sum).Sum
          Write-Host "$($parts.Count) parts (exe + $($bins.Count) .bin), $total bytes total"

      - name: Build single ISO image
        if: success()
        shell: pwsh
        run: |
          $stage = $env:STAGE_DIR
          $out = Join-Path $stage 'out'
          $isoRoot = Join-Path $stage 'iso-root'
          if (Test-Path $isoRoot) { Remove-Item -Recurse -Force $isoRoot }
          New-Item -ItemType Directory -Force -Path $isoRoot | Out-Null
          # The ISO carries exactly the Inno parts the compile step just
          # produced (and that the verify step below silent-installs from
          # the mounted image). Every part is < 2 GB, so ISO9660 limits
          # are not a problem.
          $parts = Get-ChildItem $out -File | Sort-Object Name
          if (-not ($parts | Where-Object { $_.Name -eq 'ItrajiCliper-Setup-Full.exe' })) {
            throw 'ItrajiCliper-Setup-Full.exe missing from out dir'
          }
          $bins = $parts | Where-Object { $_.Extension -eq '.bin' }
          if (-not $bins) { throw 'no .bin parts in out dir to wrap into the ISO' }
          $total = ($parts | Measure-Object Length -Sum).Sum
          foreach ($p in $parts) { Copy-Item $p.FullName (Join-Path $isoRoot $p.Name) }
          $readme = @'
          Itraji Cliper — Full version (built-in AI included).
          1) If this disc image is not open yet, double-click the .iso file.
          2) Double-click ItrajiCliper-Setup-Full.exe and follow the installer.
          No internet needed — the AI bot is already inside.
          '@
          [System.IO.File]::WriteAllText((Join-Path $isoRoot 'README.txt'), $readme, (New-Object System.Text.UTF8Encoding($false)))
          # Free-space guard: the ISO duplicates the parts (~9.2 GB) and
          # IMAPI2FS needs staging room on top of that.
          $drive = (Get-Item $stage).PSDrive
          $need = 2 * $total + 2GB
          if ($drive.Free -lt $need) {
            throw "not enough free space on staging drive $($drive.Name): $([math]::Round($drive.Free / 1GB, 1)) GB free, need ~$([math]::Round($need / 1GB, 1)) GB"
          }
          Write-Host "Staging drive $($drive.Name): $([math]::Round($drive.Free / 1GB, 1)) GB free; wrapping $total bytes of installer parts"
          # Point TEMP at the staging drive so the IMAPI2FS image staging
          # does not land on the space-tight system drive.
          $tmpDir = Join-Path $stage 'iso-tmp'
          New-Item -ItemType Directory -Force -Path $tmpDir | Out-Null
          $env:TEMP = $tmpDir
          $env:TMP = $tmpDir
          # Build the ISO with the native Windows IMAPI2FS COM API
          # (MsftFileSystemImage). Fail loudly if it is unavailable -
          # no silent fallback to a different image format.
          try {
            $fsi = New-Object -ComObject IMAPI2FS.MsftFileSystemImage -ErrorAction Stop
          } catch {
            throw "IMAPI2FS (IMAPI2FS.MsftFileSystemImage) is not available on this runner: $($_.Exception.Message)"
          }
          Add-Type -TypeDefinition @'
          using System;
          using System.IO;
          using System.Runtime.InteropServices;
          using System.Runtime.InteropServices.ComTypes;

          public static class IsoImageWriter
          {
              public static void Write(IStream stream, string destinationPath)
              {
                  STATSTG stat;
                  stream.Stat(out stat, 1); // STATFLAG_NONAME
                  long size = stat.cbSize;
                  byte[] buffer = new byte[1048576];
                  IntPtr bytesReadPtr = Marshal.AllocHGlobal(sizeof(int));
                  try
                  {
                      using (FileStream output = new FileStream(destinationPath, FileMode.Create, FileAccess.Write))
                      {
                          long remaining = size;
                          while (remaining > 0)
                          {
                              int toRead = (int)Math.Min((long)buffer.Length, remaining);
                              stream.Read(buffer, toRead, bytesReadPtr);
                              int read = Marshal.ReadInt32(bytesReadPtr);
                              if (read <= 0) break;
                              output.Write(buffer, 0, read);
                              remaining -= read;
                          }
                      }
                  }
                  finally { Marshal.FreeHGlobal(bytesReadPtr); }
              }
          }
          '@
          $fsi.FileSystemsToCreate = 3   # 1 = ISO9660, 2 = Joliet -> write both
          $fsi.VolumeName = 'ITRAJI CLIPER'
          # IMAPI2FS sizes the result image against FreeMediaBlocks, whose
          # default is only 332,800 blocks of BlockSize bytes (~650 MB, a
          # CD). AddTree throws IMAPI_E_IMAGE_TOO_BIG once the estimated
          # image size passes FreeMediaBlocks x BlockSize - that default
          # is what failed the first ISO run at ~9.2 GB. Derive the limit
          # from the actual payload instead: total part bytes (plus the
          # README) converted to blocks, +15% headroom for the ISO9660 and
          # Joliet metadata, + a flat block slack. Must be set BEFORE
          # AddTree; the value (~5.15M blocks for ~9.2 GB) fits easily in
          # the property's LONG range.
          $payloadBytes = $total + (Get-Item (Join-Path $isoRoot 'README.txt')).Length
          $blockSize = $fsi.BlockSize
          if (-not $blockSize) { $blockSize = 2048 }
          $blocksNeeded = [int][math]::Ceiling($payloadBytes * 1.15 / $blockSize) + 10000
          $fsi.FreeMediaBlocks = $blocksNeeded
          Write-Host "IMAPI2FS FreeMediaBlocks set to $blocksNeeded blocks x $blockSize bytes (~$([math]::Round($blocksNeeded * $blockSize / 1GB, 2)) GB) for $payloadBytes payload bytes"
          $fsi.Root.AddTree($isoRoot, $false)
          $result = $fsi.CreateResultImage()
          $isoPath = Join-Path $out 'ItrajiCliper-Full.iso'
          [IsoImageWriter]::Write([System.Runtime.InteropServices.ComTypes.IStream]$result.ImageStream, $isoPath)
          $isoItem = Get-Item $isoPath
          if ($isoItem.Length -lt 9000000000) { throw "ISO image suspiciously small: $($isoItem.Length) bytes" }
          $isoHash = (Get-FileHash $isoPath -Algorithm SHA256).Hash.ToLower()
          Write-Host "ISO image: $($isoItem.Name), $($isoItem.Length) bytes, sha256 $isoHash"
          # The artifact must contain ONLY the .iso: remove the loose
          # parts (they live on inside the image) and the staging tree.
          Get-ChildItem $out -File | Where-Object { $_.FullName -ne $isoPath } | Remove-Item -Force
          Remove-Item -Recurse -Force $isoRoot
          Get-ChildItem $out -File | Select-Object Name, Length | Format-Table | Out-String | Write-Host

      - name: Verify the ISO installer (mount, silent install, model hash, integrity manifest)
        if: success()
        shell: pwsh
        timeout-minutes: 60
        run: |
          $iso = Join-Path $env:STAGE_DIR 'out\ItrajiCliper-Full.iso'
          if (-not (Test-Path $iso)) { throw 'ItrajiCliper-Full.iso missing from out dir' }
          $isoItem = Get-Item $iso
          $isoHash = (Get-FileHash $iso -Algorithm SHA256).Hash.ToLower()
          Write-Host "ISO image: $($isoItem.Length) bytes, sha256 $isoHash"
          $idir = Join-Path $env:STAGE_DIR 'install-test'
          if (Test-Path $idir) { Remove-Item -Recurse -Force $idir }
          # NOTE: mounting the ISO is exactly what a user does by
          # double-clicking it - Windows 10/11 mounts .iso files
          # natively as a virtual DVD drive, no extra software needed.
          $mounted = $false
          try {
            $img = Mount-DiskImage -ImagePath $iso -PassThru -ErrorAction Stop
            $mounted = $true
            $letter = $null
            for ($i = 0; $i -lt 15 -and -not $letter; $i++) {
              $vol = $img | Get-Volume -ErrorAction SilentlyContinue
              if ($vol -and $vol.DriveLetter) { $letter = $vol.DriveLetter }
              if (-not $letter) { Start-Sleep -Seconds 2 }
            }
            if (-not $letter) { throw 'mounted ISO never got a drive letter' }
            $setup = "${letter}:\ItrajiCliper-Setup-Full.exe"
            if (-not (Test-Path $setup)) { throw "setup exe not found on mounted ISO at $setup" }
            Write-Host "Mounted ISO at ${letter}: - running $setup"
            $p = Start-Process $setup -Wait -PassThru -ArgumentList `
              '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$idir"
            if ($p.ExitCode -ne 0) { throw "silent install exit code $($p.ExitCode)" }
            # The same verification battery that passed on the loose
            # Inno parts in run #3 - now against the tree installed
            # FROM the mounted ISO.
            $model = Join-Path $idir 'models\Qwen2.5-14B-Instruct-Q4_K_M.gguf'
            $f = Get-Item $model
            if ($f.Length -ne 8988110976) {
              throw "installed model size mismatch: got $($f.Length), want 8988110976"
            }
            $h = (Get-FileHash $model -Algorithm SHA256).Hash.ToLower()
            if ($h -ne 'e47ad95dad6ff848b431053b375adb5d39321290ea2c638682577dafca87c008') {
              throw "installed model SHA256 mismatch: got $h"
            }
            if (-not (Get-ChildItem -Recurse (Join-Path $idir 'llama') -Filter 'llama-server.exe')) {
              throw 'installed llama-server.exe missing under llama\'
            }
            if (-not (Test-Path (Join-Path $idir 'ClipMakerPC.exe'))) {
              throw 'installed ClipMakerPC.exe missing'
            }
            Get-ChildItem $idir | Select-Object Name
            Get-ChildItem (Join-Path $idir '_internal') | Select-Object Name
            # The app itself verifies integrity against its bundle dir
            # (BASE_DIR = sys._MEIPASS = the _internal folder of the
            # installed onedir layout), so this check must point at
            # _internal too - NOT the install root.
            $env:ITRAJI_INSTALL_DIR = Join-Path $idir '_internal'
            python -c "import os, sys, licensing; ok, bad = licensing.verify_integrity(os.environ['ITRAJI_INSTALL_DIR']); print('verify_integrity:', ok, bad); sys.exit(0 if ok else 1)"
            if ($LASTEXITCODE -ne 0) { throw 'integrity manifest check failed on installed payload' }
            Write-Host 'ISO installer verification passed: mounted ISO, silent install, model bytes + hash, engine, app exe, signed integrity manifest.'
          } finally {
            if ($mounted) { Dismount-DiskImage -ImagePath $iso -ErrorAction SilentlyContinue | Out-Null }
          }

      - name: Write build summary
        if: success()
        shell: pwsh
        run: |
          $out = Join-Path $env:STAGE_DIR 'out'
          $iso = Join-Path $out 'ItrajiCliper-Full.iso'
          $isoHash = (Get-FileHash $iso -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item $iso).Length
          $lines = @(
            '## ItrajiCliper-Full (single ISO disc image)'
            ''
            "Single file: ItrajiCliper-Full.iso, $size bytes, SHA256: $isoHash"
            'Contents: the proven Inno Setup multi-part installer (ItrajiCliper-Setup-Full.exe + .bin parts, each < 2 GB) plus a README.txt. Double-clicking the .iso in Windows 10/11 mounts it as a virtual DVD drive; running ItrajiCliper-Setup-Full.exe inside installs the app with the built-in AI already inside - no internet needed at install time.'
            'Model: Qwen2.5-14B-Instruct-Q4_K_M.gguf, 8988110976 bytes, sha256 e47ad95dad6ff848b431053b375adb5d39321290ea2c638682577dafca87c008 (verified before packaging and again in the installed tree)'
            'ISO verification on the runner: PASSED (ISO mounted, setup silent-installed from the mounted image, model bytes + hash, engine, app exe, signed integrity manifest)'
          )
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload FULL installer as workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ItrajiCliper-Setup-Full
          path: ${{ env.STAGE_DIR }}/out/
          compression-level: 0
          if-no-files-found: error

      - name: File failure issue with log tail
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY="$(tail -c 6000 build.log 2>/dev/null || echo 'no build log captured')"
          gh issue create --title "FULL Windows build failed (${GITHUB_SHA:0:7})" --body "Build log tail:
          \`\`\`
          $BODY
          \`\`\`
          [View the run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
